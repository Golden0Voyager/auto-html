name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install test dependencies
        # 使用 uv pip install 而非 uv sync --dev：项目通过 [tool.uv.sources]
        # 依赖同级项目 auto-hub，且无需在 CI 中安装生产依赖。
        run: uv venv && uv pip install pytest pytest-cov ruff mypy

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run mypy
        run: uv run mypy src/ || true
      - name: Run security scan (bandit)
        run: uv tool run bandit -r src/ || true

      - name: Run dependency audit
        run: uv audit || true


      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing tests/

      - name: Enforce coverage threshold
        run: uv run coverage report
