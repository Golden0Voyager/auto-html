[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md_to_html"
version = "0.1.0"
description = "将 AI 生成的 Markdown 文档转换为精美可读的 HTML 文件，支持 SenseNova AI 生图"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Haining Yu"},
]
keywords = ["markdown", "html", "ai", "image-generation", "sensenova"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "mistune>=3.0",
    "pygments>=2.15",
    "requests>=2.31",
    "auto-hub",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
]
watch = [
    "watchdog>=3.0",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
]

[project.scripts]
md_to_html = "md_to_html.cli:main"

[project.urls]
Homepage = "https://github.com/Golden0Voyager/auto-html"
Repository = "https://github.com/Golden0Voyager/auto-html"
Issues = "https://github.com/Golden0Voyager/auto-html/issues"

[tool.uv.sources]
auto-hub = { git = "https://github.com/Golden0Voyager/auto_hub.git", branch = "main" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
absolute = ["**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["md_to_html"]

[tool.coverage.report]
fail_under = 55
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
